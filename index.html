    <!-- ==========================================
         GOOGLE FONTS
    =========================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

          href="https://fonts.gstatic.com"

        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap"

    <!-- ==========================================
         CSS
    =========================================== -->

    <style>

        /* ==========================================
           RESET
        =========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

        }


        body {

            background: #f7f2eb;

            font-family:
                "Nunito",
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            padding: 30px 15px;

            color: #4b4038;

        }


        /* ==========================================
           MAIN CONTAINER
        =========================================== */

        .page {

            width: 100%;

            max-width: 430px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 20px;

        }


        /* ==========================================
           TITLE
        =========================================== */

        .title {

            text-align: center;

            font-family:
                "ZCOOL KuaiLe",
                sans-serif;

            font-size: 26px;

            color: #65564b;

            letter-spacing: 1px;

        }


        .subtitle {

            font-size: 13px;

            color: #9a8d82;

            margin-top: -12px;

        }


        /* ==========================================
           CARD AREA
        =========================================== */

        .card-scene {

            width: min(
                100%,
                320px
            );

            aspect-ratio: 5.4 / 9;

            perspective: 1200px;

            cursor: pointer;

            user-select: none;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* ==========================================
           CARD
        =========================================== */

        .card {

            width: 100%;

            height: 100%;

            position: relative;

            transform-style: preserve-3d;

            transition:
                transform 0.7s
                cubic-bezier(
                    0.4,
                    0.2,
                    0.2,
                    1
                );

        }


        /* ==========================================
           FLIPPED
        =========================================== */

        .card.flipped {

            transform:
                rotateY(180deg);

        }


        /* ==========================================
           CARD FACE
        =========================================== */

        .card-face {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            border-radius: 14px;

            overflow: hidden;

            backface-visibility: hidden;

            -webkit-backface-visibility: hidden;

            box-shadow:
                0 12px 30px
                rgba(
                    80,
                    60,
                    45,
                    0.18
                );

        }


        /* ==========================================
           CARD FRONT
        =========================================== */

        .card-front {

            background: #ffffff;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 35px 28px 30px;

            text-align: center;

        }


        /* ==========================================
           CARD HOLE
        =========================================== */

        .card-hole {

            position: absolute;

            top: 13px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #f7f2eb;

            box-shadow:
                inset
                0 1px 3px
                rgba(
                    0,
                    0,
                    0,
                    0.18
                );

            z-index: 10;

        }


        /* ==========================================
           VERSE
        =========================================== */

        .verse {

            width: 100%;

            font-family:
                "ZCOOL KuaiLe",
                sans-serif;

            font-size: 21px;

            line-height: 1.7;

            color: #4c4037;

            word-break: break-word;

            overflow-wrap: break-word;

            transition:
                font-size 0.2s ease;

        }


        /* ==========================================
           REFERENCE
        =========================================== */

        .reference {

            margin-top: 22px;

            font-family:
                "ZCOOL KuaiLe",
                sans-serif;

            font-size: 15px;

            color: #8c7766;

        }


        /* ==========================================
           SMALL DECORATION
        =========================================== */

        .front-decoration {

            position: absolute;

            left: 50%;

            bottom: 18px;

            transform:
                translateX(-50%);

            font-size: 11px;

            color: #b5a496;

            letter-spacing: 2px;

        }


        /* ==========================================
           CARD BACK
        =========================================== */

        .card-back {

            transform:
                rotateY(180deg);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            text-align: center;

        }


        /* ==========================================
           BACK TITLE
        =========================================== */

        .back-title {

            font-family:
                "ZCOOL KuaiLe",
                sans-serif;

            font-size: 22px;

            color: #55483e;

            margin-bottom: 18px;

        }


        /* ==========================================
           IMAGE
        =========================================== */

        .scene-image {

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            border-radius: 10px;

            display: block;

            box-shadow:
                0 5px 15px
                rgba(
                    60,
                    45,
                    35,
                    0.12
                );

        }


        /* ==========================================
           IMAGE ERROR
        =========================================== */

        .scene-image.error {

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eee;

        }


        /* ==========================================
           BACK HINT
        =========================================== */

        .back-hint {

            margin-top: 18px;

            font-size: 11px;

            color: #8d7c70;

            letter-spacing: 1px;

        }


        /* ==========================================
           PROGRESS
        =========================================== */

        .progress {

            font-size: 13px;

            color: #8f8177;

            letter-spacing: 1px;

        }


        /* ==========================================
           CONTROL HINT
        =========================================== */

        .hint {

            text-align: center;

            font-size: 12px;

            color: #a29489;

            line-height: 1.7;

        }


        /* ==========================================
           BUTTONS
        =========================================== */

        .controls {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

        }


        .control-button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background: #ffffff;

            color: #77675b;

            font-size: 18px;

            cursor: pointer;

            box-shadow:
                0 5px 15px
                rgba(
                    80,
                    60,
                    45,
                    0.10
                );

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;

        }


        .control-button:active {

            transform:
                scale(0.92);

        }


        .control-button:hover {

            box-shadow:
                0 7px 18px
                rgba(
                    80,
                    60,
                    45,
                    0.16
                );

        }


        /* ==========================================
           MOBILE
        =========================================== */

        @media (max-width: 480px) {

            body {

                padding:
                    20px 12px;

                align-items:
                    flex-start;

            }


            .page {

                padding-top: 10px;

            }


            .title {

                font-size: 23px;

            }


            .card-scene {

                width: min(
                    82vw,
                    300px
                );

            }

        }


        /* ==========================================
           SMALL PHONE
        =========================================== */

        @media (max-width: 360px) {

            .card-scene {

                width: min(
                    82vw,
                    270px
                );

            }


            .card-front {

                padding:
                    30px 22px 25px;

            }


            .verse {

                line-height: 1.6;

            }

        }

        /* ==========================================
        BLESSING
        ========================================== */

        .blessing {
            width: 92%;

            margin-bottom: 8px;

            padding: 5px 8px;

            text-align: center;

            font-family: "ZCOOL KuaiLe", sans-serif;

            font-size: 15px;

            line-height: 1.45;

            color: #5b3a24;

            

            border-radius: 10px;

            box-sizing: border-box;
        }


    </style>

</head>

        /* ==========================================
           CURRENT CARD
        =========================================== */

        let currentIndex = 0;


        /* ==========================================
           ELEMENTS
        =========================================== */

        const card =
            document.getElementById("card");

        const verse =
            document.getElementById("verse");

        const reference =
            document.getElementById("reference");

        const sceneImage =
            document.getElementById("sceneImage");

        const frontCard =
            document.querySelector(".card-front");

        const backCard =
            document.getElementById("cardBack");

        const progress =
            document.getElementById("progress");

        const previousButton =
            document.getElementById("previousButton");

        const nextButton =
            document.getElementById("nextButton");


        /* ==========================================
           BACKGROUND COLORS
        =========================================== */

        const cardColors = [
            "#ffffff", // White
            "#f1e4d2", // Beige
            "#d8d8d8"  // Grey
        ];


        /* ==========================================
           SHOW CARD
        =========================================== */

        function showCard(index) {

            const currentCard = cards[index];

            /* Front */

            verse.textContent =
                currentCard.text;

            reference.textContent =
                currentCard.reference;


            /* Back blessing */

            blessing.textContent =
                currentCard.blessing;


            /* Back image */

            sceneImage.src =
                `images/image${index + 1}.png`;


            /* Back color */

            /* Card color */

            const color =
                cardColors[index % 3];

            frontCard.style.background =
                color;

            backCard.style.background =
                color;


            /* Progress */

            progress.textContent =
                `${index + 1} / ${cards.length}`;


            /* Always return to front */

            card.classList.remove("flipped");


            /* Resize verse */

            adjustVerseSize();
        }


        /* ==========================================
           VERSE FONT SIZE
        =========================================== */

        function adjustVerseSize() {

            const length =
                verse.textContent.length;

            let fontSize;


            if (length <= 20) {

                fontSize = 21;

            }

            else if (length <= 35) {

                fontSize = 19;

            }

            else if (length <= 50) {

                fontSize = 17;

            }

            else if (length <= 70) {

                fontSize = 15;

            }

            else if (length <= 90) {

                fontSize = 13.5;

            }

            else {

                fontSize = 12;

            }


            verse.style.fontSize =
                fontSize + "px";

        }


        /* ==========================================
           FLIP CARD
        =========================================== */

        function flipCard() {

            card.classList.toggle(
                "flipped"
            );

        }


        /* ==========================================
           NEXT CARD
        =========================================== */

        function nextCard() {

            if (
                currentIndex <
                cards.length - 1
            ) {

                currentIndex++;

                showCard(
                    currentIndex
                );

            }

        }


        /* ==========================================
           PREVIOUS CARD
        =========================================== */

        function previousCard() {

            if (
                currentIndex > 0
            ) {

                currentIndex--;

                showCard(
                    currentIndex
                );

            }

        }


        /* ==========================================
           CLICK → FLIP
        =========================================== */

        card.addEventListener(
            "click",
            flipCard
        );


        /* ==========================================
           PREVIOUS BUTTON
        =========================================== */

        previousButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                previousCard();

            }
        );


        /* ==========================================
           NEXT BUTTON
        =========================================== */

        nextButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                nextCard();

            }
        );


        /* ==========================================
           KEYBOARD
        =========================================== */

        document.addEventListener(
            "keydown",
            function(event) {


                /* --------------------------
                   SPACE → FLIP
                -------------------------- */

                if (
                    event.code === "Space"
                ) {

                    event.preventDefault();

                    flipCard();

                }


                /* --------------------------
                   RIGHT → NEXT
                -------------------------- */

                if (
                    event.code ===
                    "ArrowRight"
                ) {

                    nextCard();

                }


                /* --------------------------
                   LEFT → PREVIOUS
                -------------------------- */

                if (
                    event.code ===
                    "ArrowLeft"
                ) {

                    previousCard();

                }

            }
        );


        /* ==========================================
           IMAGE ERROR
        =========================================== */

        sceneImage.addEventListener(
            "error",
            function() {

                console.warn(
                    "Image not found:",
                    sceneImage.src
                );

            }
        );


        /* ==========================================
           INITIALIZE
        =========================================== */

        showCard(
            currentIndex
        );


    </script>


</body>

</html>
